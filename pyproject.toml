[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-wallpaper-optimizer"
version = "0.5.1"
description = "Offline glyph and color optimizer for ASCII Wallpaper"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.2"]

[project.scripts]
ascii-wallpaper-render = "ascii_optimizer.cli:main"

[tool.setuptools]
packages = ["ascii_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
