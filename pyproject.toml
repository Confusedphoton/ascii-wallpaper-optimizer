[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-wallpaper-optimizer"
version = "0.6.1"
description = "Offline glyph and color optimizer for ASCII Wallpaper"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10", "torch>=2.2"]

[project.optional-dependencies]
diagnostics = ["matplotlib>=3.8", "flip-evaluator>=1.7"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
ascii-wallpaper-render = "ascii_optimizer.launcher:render_main"

[tool.setuptools]
packages = ["ascii_optimizer", "ascii_optimizer.renderers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
