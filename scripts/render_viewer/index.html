<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Render comparison</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <div class="brand"><span class="mark">◧</span><strong>Render comparison</strong><span class="subtitle">See the difference in place</span></div>
    <button id="fullscreen" title="Fullscreen (F)">Fullscreen <kbd>F</kbd></button>
  </header>
  <section class="controls" aria-label="Comparison controls">
    <div class="selection">
      <label>Image<select id="scene"></select></label>
      <label><span class="badge a">A</span><select id="first" aria-label="Image A"></select></label>
      <button id="swap" title="Swap A and B" aria-label="Swap A and B">⇄</button>
      <label><span class="badge b">B</span><select id="second" aria-label="Image B"></select></label>
      <label class="check"><input type="checkbox" id="intermediates"> Include Adam snapshots</label>
    </div>
    <div class="toolbar">
      <div class="group modes" role="group" aria-label="View mode">
        <button data-mode="flip" aria-pressed="true">Flip</button>
        <button data-mode="wipe" aria-pressed="false">Wipe</button>
        <button data-mode="error" aria-pressed="false">FLIP error</button>
      </div>
      <div class="group" id="flip-controls">
        <button id="flip">A ⇄ B <kbd>Space</kbd></button>
        <button id="auto" aria-pressed="false">Auto <kbd>Enter</kbd></button>
        <label class="inline">Hold each <input id="interval" type="range" min="150" max="2000" step="50" value="700"><output id="interval-value">700 ms</output></label>
      </div>
      <label class="inline" id="wipe-controls" hidden>Divider <input id="divider" type="range" min="0" max="100" value="50"></label>
      <div class="group" id="error-controls" hidden>
        <label class="inline">Pixels/degree <input id="ppd" type="number" min="1" max="1024" step="0.1" value="130"></label>
        <button id="compute">Recompute</button>
        <span class="error-legend"><span></span> low → high</span>
      </div>
      <div class="group zoom">
        <button id="fit" title="Fit image (0)">Fit <kbd>0</kbd></button>
        <button id="native" title="One image pixel per display pixel (1)">1:1 <kbd>1</kbd></button>
        <label class="check"><input id="nearest" type="checkbox"> Crisp pixels</label>
      </div>
    </div>
  </section>
  <main id="stage" aria-label="Image comparison viewport">
    <canvas id="canvas" tabindex="0" aria-label="Comparison image. Space flips images. Scroll to zoom and drag to pan."></canvas>
    <div id="empty">Loading images…</div>
    <div class="fullscreen-label" id="fullscreen-label"></div>
    <div class="fullscreen-help">Space · flip &nbsp; Enter · auto &nbsp; 0 · fit &nbsp; 1 · native &nbsp; Esc · exit</div>
  </main>
  <footer>
    <div><span id="current" class="current">Loading</span><span id="status" role="status" aria-live="polite"></span></div>
    <span id="help">Space flips · wheel zooms · drag pans · F fullscreen</span>
  </footer>
</body>
</html>
